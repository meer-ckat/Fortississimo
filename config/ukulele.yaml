behaviors:
  # BehaviorParameters의 Behavior Name과 정확히 일치해야 한다
  Ukulele:
    trainer_type: ppo

    hyperparameters:
      # ⚠ 아래 두 값은 환경 개수에 맞춰야 한다. buffer_size는 "정책을 갱신하기까지
      # 모으는 스텝 수"라 환경 수와 무관하게 절대값으로 걸린다.
      #
      #   에디터 Play / --num-envs 1  →  batch_size 256,  buffer_size 4096
      #   --num-envs 8 (빌드)         →  batch_size 512,  buffer_size 12288
      #
      # 환경 1개에 12288을 쓰면 5분에 한 번씩만 갱신돼 학습이 멈춘 것처럼 보인다
      batch_size: 512
      buffer_size: 12288
      learning_rate: 3.0e-4
      beta: 0.01              # 엔트로피 보너스. 행동이 3개뿐이라 조기 수렴을 막으려면 낮추지 말 것
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true         # 관측 스케일이 제각각이라 켜 두는 게 안전하다
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    # 학습률과 epsilon이 이 값에 걸쳐 선형 감소한다. 2000000으로 두면 20만에서 멈출 때
    # 거의 감소하지 않아 후반 미세조정 단계를 통째로 못 받는다. 실제 예산에 맞춰 잡는다
    max_steps: 300000

    # 한 에피소드가 15~25턴이라 64는 사실상 "에피소드 전체"다. 32면 충분하고
    # GAE 구간이 짧아져 이득 추정 분산이 준다
    time_horizon: 32
    summary_freq: 2000        # 1만은 첫 실행에 너무 깜깜하다. 학습이 안정되면 다시 올려도 된다
    keep_checkpoints: 5
    checkpoint_interval: 50000
