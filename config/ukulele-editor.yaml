# 에디터에서 Play로 돌릴 때(환경 1개) 쓰는 설정.
# 빌드 + --num-envs 8로 돌릴 때는 config/ukulele.yaml을 쓴다.
#
# 차이는 batch_size / buffer_size뿐이다. buffer_size는 "정책을 갱신하기까지 모으는
# 스텝 수"라 환경 수와 무관한 절대값이라서, 환경 1개에 12288을 쓰면
# 5분에 한 번씩만 갱신돼 학습이 멈춘 것처럼 보인다.
behaviors:
  # BehaviorParameters의 Behavior Name과 정확히 일치해야 한다
  Ukulele:
    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 0.01              # 엔트로피 보너스. 행동이 3개뿐이라 조기 수렴을 막으려면 낮추지 말 것
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true         # 관측 스케일이 제각각이라 켜 두는 게 안전하다
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 300000

    # 한 에피소드가 15~25턴이라 64는 사실상 "에피소드 전체"다. 32면 충분하고
    # GAE 구간이 짧아져 이득 추정 분산이 준다
    time_horizon: 32
    summary_freq: 2000        # 1만은 첫 실행에 너무 깜깜하다. 학습이 안정되면 다시 올려도 된다
    keep_checkpoints: 5
    checkpoint_interval: 50000
